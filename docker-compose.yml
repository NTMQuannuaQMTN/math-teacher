# Local development services. Production uses managed PostgreSQL and Cloudflare R2.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mathtutor
      POSTGRES_PASSWORD: mathtutor
      POSTGRES_DB: mathtutor
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathtutor"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible store used to exercise the R2 code path locally (no auth configured: any keys work).
  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -s3 -s3.port=8333 -dir=/data -master.volumeSizeLimitMB=64
    ports:
      - "127.0.0.1:58333:8333"
    volumes:
      - s3data:/data

volumes:
  pgdata:
  s3data:
