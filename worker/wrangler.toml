name = "math-teacher-worker"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Nightly cleanup of abandoned drafts (see src/cleanup.ts).
[triggers]
crons = ["17 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "math_teacher_db"
# Replace with the id printed by `wrangler d1 create math_teacher_db` before deploying.
database_id = "6ada5450-57fe-4b5c-878b-607b2420ee61"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "math-teacher-images"

[vars]
# "production" disables the mock OCR provider and dev-only behaviour.
ENVIRONMENT = "production"
# "gemini" | "openai" | "anthropic" | "mock" (mock only works when ENVIRONMENT = "development")
OCR_PROVIDER = "gemini"
GEMINI_OCR_MODEL = "gemini-3.1-flash-lite"
# Optional: a second provider used only when the primary OCR provider is overloaded / out of quota.
# OCR_FALLBACK_PROVIDER = "openai"
OPENAI_MODEL = "gpt-4.1-mini"
ANTHROPIC_MODEL = "claude-opus-5"
OCR_TIMEOUT_MS = "45000"
# Per-device and per-IP budgets for OCR calls (uploads + retries), per hour.
OCR_LIMIT_PER_DEVICE_PER_HOUR = "40"
OCR_LIMIT_PER_IP_PER_HOUR = "120"
# Solver (lesson generation). A cheap model writes the lesson; if the deterministic checks fail,
# the corrective retry goes to the stronger fallback model. See PROGRESS.md for cost/quality numbers.
SOLVER_PROVIDER = "gemini"
GEMINI_SOLVER_MODEL = "gemini-3.5-flash-lite"
GEMINI_SOLVER_THINKING = "low"
GEMINI_SOLVER_FALLBACK_MODEL = "gemini-3.5-flash-lite"
GEMINI_SOLVER_FALLBACK_THINKING = "high"
# OpenAI settings (used only if SOLVER_PROVIDER = "openai")
SOLVER_MODEL = "gpt-5.4-mini"
SOLVER_REASONING_EFFORT = "low"
SOLVER_FALLBACK_MODEL = "gpt-5.5"
SOLVER_FALLBACK_REASONING_EFFORT = "medium"
SOLVE_TIMEOUT_MS = "170000"
SOLVE_LIMIT_PER_DEVICE_PER_HOUR = "30"
SOLVE_LIMIT_PER_IP_PER_HOUR = "90"
# Drafts (scans never confirmed) older than this are deleted by the cron job.
DRAFT_RETENTION_DAYS = "7"
# Comma-separated browser origins allowed to call the API (only needed for Expo web).
ALLOWED_ORIGINS = ""

# Secrets — set with `wrangler secret put <NAME>`; never commit them:
#   IMAGE_URL_SECRET    (required) HMAC key for signed image URLs, 32+ random chars
#   GEMINI_API_KEY      (when OCR_PROVIDER or SOLVER_PROVIDER = "gemini"; enable billing for production limits)
#   OPENAI_API_KEY      (only when OCR_PROVIDER / OCR_FALLBACK_PROVIDER / SOLVER_PROVIDER = "openai")
#   ANTHROPIC_API_KEY   (when OCR_PROVIDER = "anthropic")
