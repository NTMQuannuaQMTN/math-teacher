name = "math-teacher-worker"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Nightly cleanup of abandoned drafts (see src/cleanup.ts).
[triggers]
crons = ["17 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "math_teacher_db"
# Replace with the id printed by `wrangler d1 create math_teacher_db` before deploying.
database_id = "6ada5450-57fe-4b5c-878b-607b2420ee61"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "math-teacher-images"

[vars]
# "production" disables the mock OCR provider and dev-only behaviour.
ENVIRONMENT = "production"
# Production OCR always uses the SocLaas vision endpoint. `mock` remains available only in development tests.
OCR_PROVIDER = "soclaas"
SOCLAAS_OCR_MODEL = "qwen3-vl:32b"
OCR_TIMEOUT_MS = "20000"
# Per-device and per-IP budgets for OCR calls (new uploads only), per hour.
OCR_LIMIT_PER_DEVICE_PER_HOUR = "40"
OCR_LIMIT_PER_IP_PER_HOUR = "120"
# Solving always uses SocLaas: classify the confirmed question, then expose only that specialist's tools.
SOLVER_PROVIDER = "soclaas"
SOLVER_AGENT = "on"
SOCLAAS_MODEL = "qwen3.6:35b"
SOLVER_DAILY_BUDGET_USD = "1"
SOLVER_AGENT_MS = "30000"
SOLVE_TIMEOUT_MS = "30000"
SOLVE_LIMIT_PER_DEVICE_PER_HOUR = "30"
SOLVE_LIMIT_PER_IP_PER_HOUR = "90"
# Drafts (scans never confirmed) older than this are deleted by the cron job.
DRAFT_RETENTION_DAYS = "7"
# Comma-separated browser origins allowed to call the API (only needed for Expo web).
ALLOWED_ORIGINS = "http://localhost:8081,http://127.0.0.1:8081"

# Secrets — set with `wrangler secret put <NAME>`; never commit them:
#   IMAGE_URL_SECRET    (required) HMAC key for signed image URLs, 32+ random chars
#   SOCLAAS_API_KEY     (required for OCR and solving)
